[platformio]
default_envs = s3

[env]
platform = espressif32@7.1.3
platform_packages =
    platformio/framework-arduinoespressif32@4.20017.260907
    platformio/tool-esptoolpy@2.41100.260830
framework = arduino
board = esp32-s3-devkitc-1
board_build.filesystem = littlefs
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.embed_files = certs/x509_crt_bundle
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DENABLE_ARDUINO_OTA=0

; Quad-SPI flash; PSRAM is deliberately unused. N8, N8R2 and N8R8.
[env:s3]
board_upload.flash_size = 8MB
board_build.partitions = partitions/s3-8mb.csv

[env:s3-4mb]
board_upload.flash_size = 4MB
board_build.partitions = partitions/s3-4mb.csv

[env:s3-16mb]
board_upload.flash_size = 16MB
board_build.partitions = partitions/s3-16mb.csv

; Use a USB-to-UART bridge instead of the S3's native USB connector.
[env:s3-uart]
extends = env:s3
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DENABLE_ARDUINO_OTA=0

[env:s3-4mb-uart]
extends = env:s3-4mb
build_flags = ${env:s3-uart.build_flags}

[env:s3-16mb-uart]
extends = env:s3-16mb
build_flags = ${env:s3-uart.build_flags}
